<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="중간고사 대비 문제집 선택, 문제 풀이 및 해설">
  <title>중간고사 대비 문제풀기</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="data/health.js"></script>
  <script defer src="data/health-law.js"></script>
  <script defer src="data/medical-records.js"></script>
  <script defer src="core.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
<main>
  <h1>중간고사 대비 문제풀기</h1>
  <section class="controls" aria-label="문제집 선택">
    <label for="setSelect">문제집</label>
    <select id="setSelect"></select>
    <div class="toolbar">
      <label for="questionSelect">문항</label>
      <select id="questionSelect"></select>
      <button id="reset" type="button">문제집 초기화</button>
    </div>
    <p id="stats" aria-live="polite"></p>
  </section>
  <article id="questionCard">
    <p id="category" class="meta"></p>
    <h2 id="questionTitle" tabindex="-1"></h2>
    <form id="answerForm">
      <p id="instruction" class="meta"></p>
      <fieldset id="options"><legend class="sr-only">정답 선택</legend></fieldset>
      <p id="notice" role="alert" hidden></p>
      <div class="answer-actions">
        <button id="submitAnswer" class="primary" type="submit">정답 확인</button>
        <button id="editAnswer" type="button" hidden>답 수정</button>
      </div>
    </form>
    <p id="feedback" role="status"></p>
    <p id="completion" role="status" hidden></p>
    <details id="explanation">
      <summary>정답·해설</summary>
      <p id="correctAnswer"></p>
      <p id="explanationText"></p>
      <div id="sources"></div>
    </details>
    <nav aria-label="문제 이동">
      <button id="prev" type="button">← 이전 문제</button>
      <span id="position"></span>
      <button id="next" type="button">다음 문제 →</button>
    </nav>
  </article>
  <p id="saveStatus" class="meta" role="status" hidden></p>
  <noscript>문제를 풀려면 JavaScript를 켜주세요.</noscript>
</main>
</body>
</html>
